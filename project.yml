name: PencilInkNative
options:
  bundleIdPrefix: com.pencilink
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  PencilInkNative:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Pencil Ink
        CFBundleName: PencilInkNative
        CFBundleShortVersionString: "3.4.0"
        CFBundleVersion: "27"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.pencilink.native
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PencilInkMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac
      - path: Resources/MacAssets.xcassets
    info:
      path: Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Pencil Ink
        CFBundleName: PencilInkNative
        CFBundleShortVersionString: "3.4.0"
        CFBundleVersion: "27"
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_NAME: PencilInkNative
        PRODUCT_BUNDLE_IDENTIFIER: com.pencilink.native.mac
        ARCHS: x86_64
        ONLY_ACTIVE_ARCH: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
