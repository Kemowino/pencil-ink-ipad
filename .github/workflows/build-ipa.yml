name: Build Pencil Ink (iPadOS IPA + Native Intel macOS App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS/iPadOS Release .app
        run: |
          xcodebuild \
            -project PencilInkNative.xcodeproj \
            -scheme PencilInkNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS/iPadOS .ipa
        run: |
          rm -rf Payload PencilInkNative.ipa
          mkdir -p Payload
          cp -r build-ios/Build/Products/Release-iphoneos/PencilInkNative.app Payload/
          zip -r -9 PencilInkNative.ipa Payload
          ls -lh PencilInkNative.ipa

      - name: Build Native Intel (x86_64) macOS AppKit .app
        run: |
          xcodebuild \
            -project PencilInkNative.xcodeproj \
            -scheme PencilInkMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-mac \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc Sign & Package Native Intel macOS .app
        run: |
          APP_PATH="build-mac/Build/Products/Release/PencilInkNative.app"
          codesign --force --deep --sign - "$APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/PencilInkNative"
          rm -f PencilInkNative-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PencilInkNative-macOS.zip
          ls -lh PencilInkNative-macOS.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PencilInkNative-Builds
          path: |
            PencilInkNative.ipa
            PencilInkNative-macOS.zip
          retention-days: 30

      - name: Publish iOS/iPadOS IPA & Native Intel macOS App to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -m1 'CFBundleShortVersionString:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VER:-3.3.0}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PencilInkNative.ipa PencilInkNative-macOS.zip --clobber
          else
            gh release create "$TAG" PencilInkNative.ipa PencilInkNative-macOS.zip \
              --title "Pencil Ink Native $TAG" \
              --notes "Pencil Ink Native $TAG — 1-Pass Zero-Allocation Exclusion Dark Paper (eliminates 2x PDF draw + transparency-layer 102% CPU spike), Disabled VisionKit Live Text Background GPU Scanning (AppleLiveTextEnabled=false), Fast Bilinear Image Resampling (View menu toggle for High-Quality), Zero-Overhead Original Paper Fast-Path, No 2,500-Page Relayout on Paper Switch, plus Per-Process GPU% (TASK_POWER_INFO_V2) & Apples-to-Apples Phase 2 vs Phase 5 Self-Test." \
              --latest
          fi
