name: Build Pencil Ink (iPad/iPhone IPA + macOS App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS/iPadOS Release .app
        run: |
          xcodebuild \
            -project PencilInkNative.xcodeproj \
            -scheme PencilInkNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS/iPadOS .ipa
        run: |
          rm -rf Payload PencilInkNative.ipa
          mkdir -p Payload
          cp -r build-ios/Build/Products/Release-iphoneos/PencilInkNative.app Payload/
          zip -r -9 PencilInkNative.ipa Payload
          ls -lh PencilInkNative.ipa

      - name: Build Universal macOS Catalyst .app (Intel x86_64 + Apple Silicon)
        run: |
          xcodebuild \
            -project PencilInkNative.xcodeproj \
            -scheme PencilInkNative \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc Sign & Package macOS .app
        run: |
          APP_PATH="build-mac/Build/Products/Release-maccatalyst/PencilInkNative.app"
          codesign --force --deep --sign - "$APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/PencilInkNative"
          rm -f PencilInkNative-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" PencilInkNative-macOS.zip
          ls -lh PencilInkNative-macOS.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PencilInkNative-Builds
          path: |
            PencilInkNative.ipa
            PencilInkNative-macOS.zip
          retention-days: 30

      - name: Publish iOS/iPadOS IPA & macOS App to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -m1 'CFBundleShortVersionString:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VER:-2.0.0}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PencilInkNative.ipa PencilInkNative-macOS.zip --clobber
          else
            gh release create "$TAG" PencilInkNative.ipa PencilInkNative-macOS.zip \
              --title "Pencil Ink Native $TAG" \
              --notes "Pencil Ink Native $TAG — Complete Efficiency & Performance Overhaul (macOS Catalyst + iPadOS): Zero-Copy IOSurface PDF Backing (Tagged sRGB, 64-Byte Aligned), Two-Tier COMPRESSION_LZ4 Page Raster Cache (RAM + Persistent LRU SSD Cache for 0% Re-Scroll PDF CPU), Automatic 50-Page CGPDFDocument Recycler (Flat Textbook RAM), Viewport-Clipped Zoom Detail Layer (<=1.4MP Crop), GPU CAShapeLayer Live Ink Fast-Path + Apple Pencil predictedTouches (-16–24ms Latency) + Dirty-Rect Ink Invalidation, O(1) Cached Stroke Bounds & HexColorCache, Dedicated Cancellable Overview Thumbnail Queue (80-Item LRU), Persistent SSD Cover Thumbnails, Async Initial Ink Load, Background DriveSyncManager I/O, and 50-Pass Deep Optimization Audit." \
              --latest
          fi
