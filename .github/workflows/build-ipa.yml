name: Build Pencil Ink iPad IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release .app
        run: |
          xcodebuild \
            -project PencilInkNative.xcodeproj \
            -scheme PencilInkNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/PencilInkNative.app Payload/
          zip -r -9 PencilInkNative.ipa Payload
          ls -lh PencilInkNative.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PencilInkNative-IPA
          path: PencilInkNative.ipa
          retention-days: 30
