name: Build Pencil Ink iPad IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release .app
        run: |
          xcodebuild \
            -project PencilInkNative.xcodeproj \
            -scheme PencilInkNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/PencilInkNative.app Payload/
          zip -r -9 PencilInkNative.ipa Payload
          ls -lh PencilInkNative.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PencilInkNative-IPA
          path: PencilInkNative.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -m1 'CFBundleShortVersionString:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VER:-1.1.0}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PencilInkNative.ipa --clobber
          else
            gh release create "$TAG" PencilInkNative.ipa \
              --title "Pencil Ink Native $TAG" \
              --notes "Pencil Ink Native $TAG — Complete Goodnotes-style UI Redesign (Library Grid with + New Tile & Fixed Landscape PDFs, House Icon Flat Tabs, Edge-to-Edge Split Toolbar, Goodnotes Page Overview, and Adaptive Light/Dark Themes)." \
              --latest
          fi
